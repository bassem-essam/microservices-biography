version: '3.8'

services:
  microservices-client:
    build: .
    container_name: microservices-api-client
    environment:
      - API_BASE_URL=http://172.17.0.1:5115
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

