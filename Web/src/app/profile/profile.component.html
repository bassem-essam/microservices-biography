<div class="max-w-lg mx-auto bg-white rounded-lg shadow-md p-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Profile Settings</h2>
  <div class="text-center">

  <!-- Avatar Section -->
  <div class="flex flex-col items-center mb-6">
    <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-4 overflow-hidden {{uploadedImageUrl ? 'border-2 border-blue-600' : '' }}">
      <img *ngIf="profile?.avatar" [src]="uploadedImageUrl || '/api/avatar/' + profile?.avatar" alt="Avatar" class="w-full h-full object-cover">
      <span *ngIf="!profile?.avatar" class="text-gray-500 text-sm">No Avatar</span>
    </div>

    <input #fileInput type="file" accept="image/*" (change)="onFileSelect($event)" class="hidden">
    <button (click)="fileInput.click()" class="text-primary hover:text-indigo-800 text-sm font-medium">
      Change Avatar
    </button>
  </div>

  <!-- Form -->
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" disabled="disabled" [(ngModel)]="formData.username" name="username"
        class="w-full px-3 py-2 border bg-gray-200 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" [(ngModel)]="formData.name" name="name"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Biography</label>
      <textarea [(ngModel)]="formData.biography" name="biography" rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>

    <button type="submit" [disabled]="loading"
      class="w-full bg-primary text-white py-2 px-4 rounded-md hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
      {{ loading ? 'Updating...' : 'Update Profile' }}
    </button>

    <a routerLink="/me" 
       class="mt-4 w-full block text-center text-primary hover:text-indigo-800 py-2 px-4 rounded-md border border-primary hover:border-indigo-800">
      View Public Profile
    </a>
  </form>

  <div *ngIf="showMessage" class="absolute bottom-0 right-0 mb-4 mr-4">
    <!-- Success Message -->
    <div *ngIf="successMessage" class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ errorMessage }}
    </div>
  </div>
</div>
