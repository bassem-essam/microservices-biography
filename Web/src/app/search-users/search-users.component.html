<div class="max-w-2xl mx-auto p-4">
  <input 
    type="text" 
    [(ngModel)]="searchQuery" 
    (input)="searchUsers()"
    placeholder="Search users..."
    class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
  >

  <div *ngIf="searchResults.length > 0" class="space-y-4">
    <div *ngFor="let user of searchResults">
      <app-user-listing [user]="user"></app-user-listing>
    </div>
  </div>

  <div *ngIf="searchQuery && searchResults.length === 0" class="p-4 text-center text-gray-500">
    No users found matching "{{ searchQuery }}"
  </div>
</div>
