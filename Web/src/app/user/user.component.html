<div class="" *ngIf="!loading">
    <div class="max-w-7xl mx-auto sm:px-6 lg:px-8 m-4">
        <div class="bg-white overflow-hidden">
            <div class="py-6 bg-white border border-gray-400 rounded-lg">
                <div class="flex items-center gap-4 justify-start border-b border-gray-400">
                    <div class="ml-4 rounded-full w-40 h-40 bg-gray-100 mb-4 overflow-hidden">
                        <img src="{{ user.avatar == '' ? '/assets/default-avatar.png' : '/api/avatar/' + user.avatar }} "
                            alt="Profile picture of {{ user.name }}" />
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 sm:text-4xl">{{ user.name }}</h1>
                        <p class="text-gray-600">Visits: {{ user.visitCount }}</p>
                    </div>
                </div>
                <pre class="mt-3 text-left text-base sm:text-lg md:mt-5 md:text-xl px-6 font-sans text-wrap">
{{ user.biography }}
</pre>
            </div>
        </div>
    </div>
</div>
