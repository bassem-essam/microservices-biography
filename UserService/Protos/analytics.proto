syntax = "proto3";

option csharp_namespace = "UserService";

package analytics;

service Analytics {
  rpc GetUserVisitCount (UserVisitRequest) returns (UserVisitResponse);
  rpc GetUserAnalytics (UserAnalyticsRequest) returns (UserAnalyticsResponse);
  rpc GetTopVisitedUsers (TopUsersRequest) returns (TopUsersResponse);
}

message UserVisitRequest {
  string user_id = 1;
}

message UserVisitResponse {
  string user_id = 1;
  int32 visit_count = 2;
  string first_visit = 3;
  string last_visit = 4;
}

message UserAnalyticsRequest {
  string user_id = 1;
}

message UserAnalyticsResponse {
  string user_id = 1;
  int32 visit_count = 2;
  string created_at = 3;
  string first_visit = 4;
  string last_visit = 5;
  repeated string visit_dates = 6;
}

message TopUsersRequest {
  int32 limit = 1;
}

message TopUsersResponse {
  repeated UserVisitResponse users = 1;
}

